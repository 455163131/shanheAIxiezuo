name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

# 同一分支的新推送会取消旧跑，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 1) 构建 + 单元测试（跨平台矩阵）----------
  # 同时是“我写的未编译代码”的真相验证：在 ubuntu/windows 上真正编译+链接+跑 ctest。
  # Windows 上还会真正走 DPAPI 路径（credentialStore 单测的 round-trip）。
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
          # 钉到 windows-2022 而非 windows-latest：2025 起的 windows-latest 默认镜像
          # 不再预装 Visual Studio 2022，本配置强依赖 `Visual Studio 17 2022` 生成器，
          # 跑在 2025 上会直接 "could not find any instance of Visual Studio"。需要更新
          # 到新 runner 时同步改用 `Ninja` 生成器 + MSVC toolchain。
          - os: windows-2022
            host: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt ${{ matrix.host }}
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.1'
          host: ${{ matrix.host }}
          cache: true

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
        shell: bash

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Ninja' }}"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt_dir }}"
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: bash

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        shell: bash

  # ---------- 2) clang-tidy 静态分析（温和门禁）----------
  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.1'
          host: linux
          cache: true

      - name: Install clang-tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-tools ninja-build
        shell: bash

      - name: Configure (export compile_commands)
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt_dir }}"
        shell: bash

      - name: clang-tidy
        # 只扫 src/。tests/test_shanhe.cpp 是「Q_OBJECT in .cpp + #include "test_shanhe.moc"」
        # 模式，单独分析时 .moc 还没生成，clang-tidy 会以 "file not found" 失败；
        # 测试代码自身的正确性由 ctest 在 build-and-test 矩阵里真跑兜底。
        run: |
          run-clang-tidy -p build \
            -header-filter='src/.*\.h$' \
            src/.*\.cpp 2>&1 | tee clang-tidy.log
          echo "clang-tidy 完成（见上方日志；warning 不阻断 CI，按报告第5节逐步收敛）"
        shell: bash

  # ---------- 3) clazy（Qt 专用静态分析，best-effort）----------
  # continue-on-error：clazy 与特定 clang 版本强耦合，工具链版本错位时不应阻断团队。
  clazy:
    name: clazy (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.1'
          host: linux
          cache: true

      - name: Install clazy + clang
        run: sudo apt-get update && sudo apt-get install -y clazy clang ninja-build
        shell: bash

      - name: Configure with clazy
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DCMAKE_CXX_COMPILER=clazy
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt_dir }}"
        shell: bash

      - name: Build (clazy instruments)
        run: cmake --build build --parallel
        shell: bash

  # ---------- 4) qmllint QML 静态检查（best-effort）----------
  # 抓「对不存在属性赋值」这类 qmlcachegen 不校验、CI 又不启动 GUI 就无法
  # 发现的错误（如本次的 layer.shadow.*）。qmllint 对 Qt 内置类型（Item.layer
  # 等）能直接判定 Unknown property，无需解析自定义 ShanHe module。
  # 探测式：qmllint 不可用则跳过；continue-on-error 保证永不阻塞主流程。
  qml-lint:
    name: qmllint (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.1'
          host: linux
          cache: true
          tools: 'qttools'

      - name: qmllint scan
        run: |
          if ! command -v qmllint >/dev/null 2>&1; then
            echo "qmllint 未安装，跳过（不影响主流程）"
            exit 0
          fi
          qmllint qml/ 2>&1 | tee qmllint.log
          # 精准拦截「对不存在属性赋值」这类致命错误（qmlcachegen 不校验、
          # CI 不启动 GUI 就发现不了，只能靠本机双击暴露）。qmllint 对此以
          # "Unknown property" 形式报告。命中即让本 job 标红（但 job 设了
          # continue-on-error，不阻塞整体合并），由开发者据此修复。
          if grep -qiE "unknown property" qmllint.log; then
            echo "::error::qmllint 发现 Unknown property（致命 QML 属性错误），请修复后再合并"
            exit 1
          fi
          echo "qmllint 扫描完成（无 Unknown property）"
        shell: bash
